version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: crm_tattoo_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: crm_tattoo_db
    ports:
      - "5435:5432"
    volumes:
      - crm_tattoo_pgdata:/var/lib/postgresql/data

volumes:
  crm_tattoo_pgdata:
